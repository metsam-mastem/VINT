[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-intelligence"
version = "0.1.0"
description = "Local-first multimodal asset intake and evidence contract core"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ri-validate = "reel_intelligence.cli:main"\nri-intake = "reel_intelligence.intake_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
