name: REEL INTELLIGENCE CI

on:
  pull_request:
    paths:
      - "projects/reel-intelligence/**"
      - ".github/workflows/ri-ci.yml"
  push:
    branches:
      - main
      - feat/reel-intelligence-ri001-contract-validator
    paths:
      - "projects/reel-intelligence/**"
      - ".github/workflows/ri-ci.yml"

permissions:
  contents: read

concurrency:
  group: reel-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / RI-001
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    defaults:
      run:
        working-directory: projects/reel-intelligence

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/reel-intelligence/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src

      - name: Run acceptance tests
        run: python -m pytest -q

      - name: Verify CLI entry point
        run: ri-validate --help
