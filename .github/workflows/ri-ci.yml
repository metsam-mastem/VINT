name: REEL INTELLIGENCE CI

on:
  pull_request:
    paths:
      - "projects/reel-intelligence/**"
      - ".github/workflows/ri-ci.yml"
  push:
    branches:
      - main
      - feat/reel-intelligence-ri001-contract-validator
    paths:
      - "projects/reel-intelligence/**"
      - ".github/workflows/ri-ci.yml"

permissions:
  contents: read

concurrency:
  group: reel-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / REEL INTELLIGENCE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    defaults:
      run:
        working-directory: projects/reel-intelligence

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/reel-intelligence/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src

      - name: Run acceptance tests
        run: python -m pytest -q

      - name: Verify CLI entry points
        run: |
          ri-validate --help
          ri-intake --help
          ri-probe --help
          ri-catalog --help
          ri-extract --help

  package-workbench:
    name: Package offline web workbench
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js for browser hash tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test streaming SHA-256 implementation
        run: node --test projects/reel-intelligence/web/tests/hash.test.cjs

      - name: Verify static web app bundle
        run: |
          test -s projects/reel-intelligence/web/index.html
          test -s projects/reel-intelligence/web/app.js
          test -s projects/reel-intelligence/web/sha256.js
          test -s projects/reel-intelligence/web/sw.js

      - name: Upload workbench bundle
        uses: actions/upload-artifact@v4
        with:
          name: reel-intelligence-workbench
          path: projects/reel-intelligence/web/
          if-no-files-found: error
          retention-days: 14
