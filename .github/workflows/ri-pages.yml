name: Publish REEL INTELLIGENCE Workbench

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "projects/reel-intelligence/web/**"
      - ".github/workflows/ri-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ri-workbench-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static workbench
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/reel-intelligence/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
